# One line per version, and the comment above a line says what makes it non-obvious.
#
# Every version below was read from `repo1.maven.org`'s own `maven-metadata.xml` on 2026-09-11, not
# recalled and not taken from the search API, which answers some of them stale. Where the newest
# release was NOT chosen, the line says why — "newest" is a fact about the registry, not a reason.

[versions]

# NOT HERE ANY MORE. `wip`, the catalog a sborka release publishes, carries `kotlin`, and the three
# reasons this line used to give for staying on 2.4.10 were all re-checked before it moved:
#
#   * the verification addresses in `docs/research/research-architecture.md` §1.3 and §1.5 were
#     re-dumped against the 2.4.20 distribution and every one of them still holds — `__environ` on
#     linux_x64, neither global on macos_arm64, `_NSGetEnviron` in none of the three klibs. The
#     document now names the distribution it was re-checked in;
#   * "the version the portfolio's toolkits are built with" now argues the other way: the portfolio
#     moved, and kore resolving beside it means moving too;
#   * the 2.4.20 distribution is already on both machines, so the download it warned about is not
#     ahead of anyone.

# The current release, and also the exact artefact §1.1-§1.4 of the research were read in:
# `EmbeddedServerJvm.kt:404`, `EmbeddedServerNix.kt:84`, `CIOApplicationEngine.kt:91`,
# `ServerPipeline.kt`. The whole reason kore exists is a difference between two files in THIS
# version; a bump is a re-read of those four places before anything else.
ktor = "3.6.0"

# The current release. `api` rather than `implementation` wherever it appears: kore hands back and
# takes in coroutine types, so they are part of the surface rather than a detail behind it.
coroutines = "1.11.0"

# WHAT THE JVM HALF COMPILES TO — **decided in B-43**, and it stays at the portfolio's number.
#
# A library published at 25 cannot be consumed below 25, and kore is public, so this is the one line
# here an outside consumer might need changed. It stays at 25 for a reason that survives being
# checked: every consumer that exists is a service in this portfolio and they are on 25 already, and
# **the direction is reversible the way it is written and not the other way round.** Lowering the
# floor later breaks nobody — a consumer on 25 can use a library compiled for 17. Raising it breaks
# everyone below. So starting high is the change that can be taken back.
#
# Nothing in kore needs 25: it is a choice, not a constraint. If an outside consumer asks, lowering
# it is a build change and a re-run of the suite, not a redesign.
jvmToolchain = "25"

# THE ORACLE MODULE ONLY, and only for a check that is invoked by name (B-47). kore takes no driver
# dependency: what it ships is the *shape* of a store check, and which pool a service uses is the
# service's choice. This is here to verify one behaviour of one driver — that a pool hands out a
# connection whose far end is gone — because everything kore says about store checks rests on it and
# research §1.9 derived it rather than observed it.
sqlx4k = "1.13.0"

# THE THREE AGENTS, from the portfolio's own repository (B-37). The versions are the ones the first
# consumer resolves today, deliberately: kore is adopted BY that service (B-33), and a library that
# drags its consumer's agents to different versions as a side effect of being adopted is a library
# that costs more than it says.
#
# katcher is TWO version lines that move independently — the client and the server are not released
# together — so this names the client's line and nothing else.
#
# 0.7.47 is the exception to "the first consumer's version" above, and deliberately: it is the release
# that answers youndie/katcher#50, and `kore-observability` calls `Katcher.flush` — which 0.7.44 does
# not have. Moving back loses the call, not just a patch level.
# TWO LINES THAT MOVE INDEPENDENTLY, and naming one version for both would be wrong about one of
# them. `booblik-client` and `booblik-native` are separate artefacts with separate release histories;
# Central carries 0.3.3 of each. The first consumer is ahead on the client line (0.3.4, from the
# portfolio's own repository) — kore pins what Central serves, because `kore-booblik` is not one of
# the portfolio-only modules.
booblikClient = "0.3.4"
booblikNative = "0.3.4"

tracyAgent = "0.2.15"
metrikAgent = "0.3.21"
katcherClient = "0.7.47"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# The engine, and only the SAMPLE depends on it. kore-ktor takes whatever `EmbeddedServer` it is
# handed; putting an engine in a library's classpath is choosing one for every consumer. CIO because
# it is what the portfolio's native services run and what research §1.2 and §1.4 were read from.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Test-only, and it is load-bearing rather than a convenience: the stage machine is about DURATIONS,
# and a test that waits real seconds for a five-second stage measures the runner and takes five
# seconds doing it. `runTest` gives a virtual clock, and its scheduler's own `timeSource` is what the
# transcript's marks are taken from, so an assertion about "the stage ended at its deadline" is exact
# rather than approximately true.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Test-only. It publishes linuxx64, linuxarm64 and macosarm64 — checked in Central before depending on
# it from a common test source set, which is the check a `-jvm`-suffixed coordinate in a KMP module
# means somebody skipped.
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# `kore-observability` only. Each is KMP and each is checked to publish the four targets kore
# declares, because a `-jvm` coordinate silently satisfying a common source set is the shape of bug
# that only appears for the consumer who is not on the JVM.
tracy-agent = { module = "io.github.youndie.tracy:agent", version.ref = "tracyAgent" }
# `kore-booblik` only, and one per platform: the two clients have different package names and
# different APIs, which is why there are two adapters rather than one (research D5, B-36).
booblik-client = { module = "io.github.youndie.booblik:booblik-client", version.ref = "booblikClient" }
booblik-native = { module = "io.github.youndie.booblik:booblik-native", version.ref = "booblikNative" }
metrik-agent = { module = "io.github.youndie.metrik:agent", version.ref = "metrikAgent" }
katcher-client = { module = "io.github.youndie.katcher:client", version.ref = "katcherClient" }

sqlx4k-postgres = { module = "io.github.smyrgeorge:sqlx4k-postgres", version.ref = "sqlx4k" }

[plugins]
