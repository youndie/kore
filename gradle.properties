org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin/Native needs its own heap, and the default is small enough that a four-target build spends
# its time in GC rather than in the compiler.
kotlin.native.jvmArgs=-Xmx3g

# kore-core's signal handler is C through cinterop (B-64), used from the shared `nativeMain`. Without
# commonization the metadata compilation of `nativeMain` sees no binding and fails, while every
# per-target compilation passes, so only `./gradlew build` shows it.
kotlin.mpp.enableCInteropCommonization=true
