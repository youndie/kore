# Publishing kore to the portfolio's repository.
#
# MANUAL, not on every push to the default branch. A version number other builds resolve cannot be
# taken back, so publishing is a decision somebody makes rather than a side effect of merging — which
# is the same reason the oracle is not wired into `check`.
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Leave empty for 0.1.<run number>."
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The same cache key the check workflow uses: the Kotlin/Native distribution and the platform
      # klibs of four targets are the expensive half of any build here, and a publish builds all of
      # them.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Determine version
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="0.1.${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing $v"

      # THE GATE BEFORE THE BUTTON. A publish that ships a version whose tests were never run is the
      # one mistake this cannot take back, and `publish` does not depend on `check` having passed.
      - name: Build and test everything first
        run: make build GRADLEFLAGS=--no-daemon
        env:
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}

      # NO MODULE NAMES HERE, DELIBERATELY (B-48). `maven-publish` is applied by one rule in the root
      # build to every `:kore-*` module, so the root task already means all of them; `samples/*` has
      # no publication and cannot acquire one by accident. The list that used to stand here named
      # three modules, was written when there were three, and went on naming three after
      # `kore-booblik` arrived — so 0.1.0 shipped without the module its first consumer needed.
      # THE LOCAL COPY FIRST, ON ITS OWN, AND NOTHING GOES OVER THE NETWORK YET. It is what the
      # pre-flight below and the read-back at the end both walk, and producing it first is what makes
      # a refusal possible before the first PUT rather than after some of them.
      - name: Produce the publication locally
        # TWO TASKS, and the second one is why #58 happened. `kore-build` is an INCLUDED build, not a
        # `:kore-*` subproject — a plugin cannot be applied by the build that compiles it — so the
        # root task does not reach it, and B-48's completeness check, which read `include(":kore-*")`
        # out of settings.gradle.kts, could not see a form this build does not have. The check below
        # walks the `kore-*` directories instead: the rule is "everything kore ships publishes", and a
        # directory is what a module actually is, whichever way it gets into the build.
        run: |
          ./gradlew --no-daemon \
            publishAllPublicationsToLocalCopyRepository \
            :kore-build:publishAllPublicationsToLocalCopyRepository
        env:
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}

      # REFUSE A VERSION THAT ALREADY HAS ARTEFACTS, before writing any.
      #
      # `snapshots` does not allow an overwrite — it answers 409 — so a publish that fails partway
      # leaves a version that can never be completed under the same number, and the next attempt
      # fails on the artefacts the previous one managed to write instead of on the reason it stopped.
      # That happened to 0.1.1: a 403 on a coordinate the token did not cover stopped the run after
      # three jars were already up, and re-running printed three 409s that said nothing about the 403.
      #
      # This makes the second run say the true thing — this version is taken — and it also refuses a
      # re-publish of a released version, which would make one coordinate mean two things.
      - name: Refuse to publish over a version that already exists
        run: |
          v="${{ steps.ver.outputs.version }}"
          taken=0
          for f in $(find build/published -type f \( -name "*-$v.pom" -o -name "*-$v.jar" \) | sort); do
            path=${f#build/published/}
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://reposilite.kotlin.website/snapshots/$path")
            [ "$code" = "404" ] && continue
            echo "$code $path"
            taken=1
          done
          [ "$taken" = 0 ] || {
            echo "::error::$v already has artefacts on the repository - publish a new version, not this one"
            exit 1; }
          echo "$v is free"

      - name: Publish
        run: |
          ./gradlew --no-daemon \
            publishAllPublicationsToWipRepository \
            :kore-build:publishAllPublicationsToWipRepository
        env:
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}

      # READ IT BACK. A green publish task is not a published artefact: the repository can accept the
      # PUT and serve nothing, and the token here is scoped to artifact paths rather than to the
      # group, so a new coordinate can be refused while its neighbour succeeds.
      #
      # What is looked up is what the build just produced — the local copy from the step above — and
      # not a list. A list verifies the coordinates somebody remembered; this verifies the set.
      - name: Verify the artefacts are actually served
        run: |
          v="${{ steps.ver.outputs.version }}"
          poms=$(find build/published -name "*-$v.pom" | sort)
          [ -n "$poms" ] || { echo "::error::the publish produced no local copy to verify"; exit 1; }
          echo "verifying $(echo "$poms" | wc -l) coordinates"

          # EVERY MODULE KORE SHIPS, and the list is the filesystem. A floor on the number is vacuous
          # in the way that matters: a whole module missing still leaves a count above any floor worth
          # writing.
          #
          # This read `include(":kore-*")` out of settings.gradle.kts until #58 — the shape four of the
          # five modules happen to have. `kore-build` has the fifth, `includeBuild`, and was invisible
          # to a check written by looking at the others.
          missing=0
          for d in kore-*/; do
            m=${d%/}
            [ -d "build/published/io/github/youndie/$m/$v" ] || {
              echo "::error::$m is in this repository and published nothing"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          fail=0
          for pom in $poms; do
            path=${pom#build/published/}
            url="https://reposilite.kotlin.website/snapshots/$path"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "::error::a coordinate was not served after publishing"; exit 1; }
