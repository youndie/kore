# From docs-bootstrap's templates/workflow-check.yaml, for the default layout - `docs/` inside this
# repository - with this repository's code gate beside it. The Makefile at the root is its other half.
#
# THE VERSION OF THE CHECKS IS WRITTEN HERE AND NOWHERE ELSE: the ref in the `uses:` lines below.
# CI runs the checks at that ref because the runner resolves it; the Makefile reads the same line
# and fetches the same ref for a local `make check`. Renovate's github-actions manager bumps it, so a
# release of the checks arrives as one pull request that moves CI and every laptop together. Both
# jobs name the same ref, and the Makefile refuses to guess when they do not.
#
# Do not replace the action with copied scripts to save a network fetch. That is how one portfolio
# came to hold 18 copies of one script in three versions, eleven of them missing a guard that had
# been fixed upstream for weeks.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  # `push` narrowed to the default branch on 2026-09-11 (B-07). NOT a path filter — those are refused
  # below for good reasons — but a trigger filter, and it removes a duplicate: every item in this
  # backlog opens a pull request, so an unrestricted `push` ran the whole workflow twice for every
  # commit on a branch. With a build job in it that is no longer a rounding error.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

# Supersede a pull request's own earlier runs; never cancel one on the default branch, where the run
# is the record of what that commit did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to the default branch, `status: draft` as an error. Why each sits where it does,
  # and when the first is only a backstop, is written next to the step in the action's action.yml.
  #
  # Checks of the project's own belong in the Makefile under `gate`, not as steps here: then a
  # contributor runs them too. Steps that need a toolchain the gate should not (a JDK for a
  # formatter) go after this one, or in a job of their own.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/docs-bootstrap@v0.3.0

  # THE CODE GATE, and it exists because the job above does not compile anything. `make check` reads
  # the documents; a repository whose only required check reads documents is one where a pull request
  # that does not build is green — and this loop merges on green.
  #
  # One `./gradlew build` for all four targets. What that covers is not obvious and is written down
  # in CLAUDE.md rather than left to be assumed: `linuxArm64Test` and `macosArm64Test` are SKIPPED on
  # a Linux host, inside a successful build, so green means those two targets COMPILE.
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The Gradle distribution, the dependency cache and the build cache.
      - uses: gradle/actions/setup-gradle@v4

      # ~/.konan is NOT part of the Gradle cache and it is the expensive half: the Kotlin/Native
      # distribution plus the platform klibs of four targets. Without this every run downloads it
      # again, which is the difference this item was written to measure.
      #
      # Keyed on the Kotlin version, because that is what decides which distribution is fetched —
      # not on a lockfile, which does not name it.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      # `make build`, not `./gradlew` directly, so the command a contributor runs and the command
      # that gates a pull request are one string in one place — the same reason the job above runs
      # `make check` rather than listing the scripts.
      - run: make build GRADLEFLAGS=--no-daemon

      # Read the result files rather than trusting the exit code. A suite that ran zero tests exits
      # zero, and on a multiplatform build the tests that silently do not run are the interesting
      # ones.
      # Cross-linked here rather than on the arm64 runner, because Kotlin/Native cannot host on
      # linux_arm64 — see `linux-arm64-suite` below. The output is an aarch64 ELF that needs no
      # toolchain to run, only a machine of that architecture.
      - run: ./gradlew linkDebugTestLinuxArm64 --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: linuxarm64-test-binaries
          path: "*/build/bin/linuxArm64/debugTest/test.kexe"
          if-no-files-found: error

      - name: report which suites actually ran
        if: always()
        run: |
          found=0
          for f in $(find . -path '*test-results*' -name '*.xml' | sort); do
            printf '%s ' "${f#./}"
            grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || echo
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::no test result files - no suite ran"; exit 1; }

  # macosArm64 — A TARGET THE JOB ABOVE ONLY COMPILES (B-49). Kotlin/Native runs a test binary only
  # when its target is the host, so an x86-64 Linux runner builds `macosArm64` and leaves its suite
  # *disabled*: `Task 'macosArm64Test' for target 'macos_arm64' cannot run on the current host`,
  # printed as a warning inside BUILD SUCCESSFUL. Green said *compiles* and a reader heard *works*.
  #
  # A real host rather than an emulator, and affordable because this repository is PUBLIC: GitHub
  # charges for *larger* runners only, so a standard `macos-14` is free here.
  #
  # `./gradlew <task>` and not `make build`, breaking this repository's own rule that CI runs the
  # contributor's command. The rule holds where a contributor has one; nobody can run
  # `macosArm64Test` on Linux, so there is no single command to share.
  macos-arm64-suite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - run: ./gradlew macosArm64Test --no-daemon

      # The result file, and this suite's. A green `macosArm64Test` on a host where the target is not
      # the host is exactly the disabled non-event this job exists to end, so what is checked is that
      # the named suite produced results containing tests — not that the build exited zero.
      - name: report what macosArm64Test actually ran
        if: always()
        run: |
          files=$(find . -path '*test-results/macosArm64Test*' -name '*.xml' | sort)
          [ -n "$files" ] || { echo "::error::macosArm64Test produced no result files - it was disabled"; exit 1; }
          total=0
          for f in $files; do
            n=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
            printf '%s tests=%s\n' "${f#./}" "$n"
            total=$((total + n))
          done
          echo "$total tests on macos-14"
          [ "$total" -gt 0 ] || { echo "::error::macosArm64Test ran zero tests"; exit 1; }

  # linuxArm64 — AND HERE THERE IS NO TASK TO RUN AT ALL, which is a sharper fact than the one this
  # item started from. The Kotlin Gradle plugin gives a native target a test task only where
  # Kotlin/Native supports that target as a **host**, and `linux_arm64` is not one of those: in
  # `tasks --all`, `macosArm64Test` is present and disabled, while `linuxArm64Test` is absent. Asking
  # for it does not report a skip — it fails with `Task 'linuxArm64Test' is ambiguous`, because the
  # name belongs to nothing. No runner of any architecture can be told to run it, and CLAUDE.md
  # calling both of them "SKIPPED" was one word covering two different states.
  #
  # What can be done is to separate linking from running, which is all the plugin does for the other
  # targets anyway. The x86-64 job cross-links `test.kexe` for `linuxArm64` — an aarch64 ELF — and an
  # arm64 runner executes it. That side needs no Gradle and no Kotlin/Native distribution: a
  # downloaded binary and a shell.
  linux-arm64-suite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linuxarm64-test-binaries

      - name: run every linuxArm64 test binary
        run: |
          kexes=$(find . -name 'test.kexe' | sort)
          [ -n "$kexes" ] || { echo "::error::no linuxArm64 test binaries were built"; exit 1; }
          # THE EXIT CODE IS THE VERDICT, and the count under it is a floor and nothing else. A suite
          # that ran zero tests exits zero, which is the failure this repository keeps meeting; but
          # reading a *pass* out of the text would be the other one, and that is not done here.
          fail=0
          total=0
          for k in $kexes; do
            chmod +x "$k"
            echo "--- $k"
            out=$("$k" 2>&1) || fail=1
            echo "$out"
            n=$(echo "$out" | sed -n 's/.*Running \([0-9][0-9]*\) test.*/\1/p' | head -1)
            total=$((total + ${n:-0}))
          done
          echo "$total tests on $(uname -m)"
          [ "$fail" = 0 ] || { echo "::error::a linuxArm64 suite failed"; exit 1; }
          [ "$total" -gt 0 ] || { echo "::error::the linuxArm64 binaries ran zero tests"; exit 1; }

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person.
  #
  # The list IS at zero since B-51 — those 13 addresses inside dependency artefacts now carry the
  # artefact before a `!/` and are reported as verified-by-unpacking rather than as rot. That still
  # does not make this a gate: what remains is the other objection, that a path quoted AS OBSOLETE
  # reads the same as a live one to a machine, and that the paths which rot are in other people's
  # repositories. Zero is now a number worth watching rather than a target that could not be hit.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The code lives in this checkout, so its parent is a directory whose one subdirectory is
      # this repository - which is exactly what REPOS (`..` by default) expects.
      - uses: youndie/docs-bootstrap@v0.3.0
        with:
          target: report

      # For a separate documentation repository, put shallow clones of the services next to the
      # step above and point REPOS at them. History is not needed - only the file tree - and a
      # repository that cannot be cloned is a warning rather than a failure, because its anchors are
      # simply unchecked.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository running the workflow. That is enough for
      # public services; a private one needs a token that can read it, and with the default one it
      # will take the warning branch every week without ever saying why.
      #
      #   - run: |
      #       mkdir -p repos && cd repos
      #       for r in service-one service-two; do
      #         git clone --depth 1 --filter=blob:none --no-checkout \
      #           "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
      #           || echo "::warning::$r is unreachable - its anchors were not checked"
      #       done
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   - uses: youndie/docs-bootstrap@v0.3.0
      #     with:
      #       target: report REPOS=repos
